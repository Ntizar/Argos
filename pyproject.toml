[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argos-tablero"
version = "2.0.0"
description = "Argos: tablero de tareas humano+agente con 6 estados, dependencias y lock. Hecho con ❤️ por David Antizar."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Antizar" }]
requires-python = ">=3.11"
keywords = ["kanban", "agentes", "ia", "tablero", "tareas"]

[project.scripts]
argos = "argos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argos"]

[tool.hatch.build.targets.wheel.force-include]
"plantilla/REGLAS-ARGOS.md" = "argos/plantilla/REGLAS-ARGOS.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
